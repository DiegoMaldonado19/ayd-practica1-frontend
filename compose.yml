name: fitness-app-frontend

services:
  frontend:
    image: node:24-alpine
    container_name: fitness_frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "[ -x node_modules/.bin/vite ] || npm ci; exec npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    volumes:
      - .:/app
      # Named volume: an anonymous one is discarded whenever Compose recreates the
      # container, which means paying for `npm ci` again on every config change.
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    healthcheck:
      # 127.0.0.1, not localhost: that resolves to ::1 here and Vite only listens on IPv4.
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:5173/" ]
      interval: 5s
      start_period: 120s

volumes:
  node_modules:
