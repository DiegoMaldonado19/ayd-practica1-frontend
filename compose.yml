name: fitness-app-frontend

services:
  dev:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "[ -x node_modules/.bin/vite ] || npm ci; exec npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"

  frontend:
    profiles: [ "prod" ]
    image: djmaldonado19/fitness-app-frontend:${VERSION:-latest}
    build:
      context: .
      target: runtime
    container_name: fitness_app_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost/" ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
