name: fitness-app

services:
  frontend:
    image: djmaldonado19/fitness-app-frontend:${VERSION:-latest}
    build:
      context: .
      target: runtime
    container_name: fitness_app_frontend
    restart: unless-stopped
    ports:
      # Keep 4200 exposed so the documented URL of the practice does not change.
      - "4200:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
